name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: LINCE (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config
      - name: Build macn-play
        run: cargo build --release --manifest-path helpers/PlayHelper/Cargo.toml --target-dir .build/play-target --target x86_64-unknown-linux-gnu
      - name: Sidecars
        run: bash scripts/prepare-sidecars.sh
      - name: Install JS deps
        run: npm ci
      - name: Build LINCE
        run: npm run tauri -- build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: lince-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    name: WINN (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build macn-play
        run: cargo build --release --manifest-path helpers/PlayHelper/Cargo.toml --target-dir .build/play-target --target x86_64-pc-windows-msvc
      - name: Sidecars
        shell: bash
        env:
          PREPARE_WINDOWS: "1"
        run: bash scripts/prepare-sidecars.sh
      - name: Install JS deps
        run: npm ci
      - name: Build WINN
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: winn-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Files
        run: find dist -type f
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
