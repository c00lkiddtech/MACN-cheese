[package]
name = "macn-play"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"  # embeds AuroraOSS / Calyx device profiles (GPL-3.0-or-later) via gpapi
description = "MACN-cheese Google Play helper: details, search and APK downloads (base + split APKs)"
publish = false

# The Google Play protocol comes from EFForg/rs-google-play (MIT), vendored in
# ../Vendor/rs-google-play. The download flow follows EFForg/apkeep (MIT).
[dependencies]
gpapi = { path = "../Vendor/rs-google-play/gpapi" }
googleplay-protobuf = { path = "../Vendor/rs-google-play/googleplay-protobuf" }
tokio = { version = "1", features = ["rt", "macros", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Make gpapi use the vendored protobuf crate too (one copy of the Play types, fully offline-vendored).
[patch.crates-io]
googleplay-protobuf = { path = "../Vendor/rs-google-play/googleplay-protobuf" }
gpapi = { path = "../Vendor/rs-google-play/gpapi" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

[workspace]
